name: Build Demos Installer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: demos-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows 10+ / demos
    runs-on: windows-2022
    timeout-minutes: 60

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure framework and demos
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMODERNUI_BUILD_EXAMPLES=ON

      - name: Build framework and demos
        run: cmake --build build -j

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Compile demos installer
        shell: powershell
        run: |
          $iscc = @(
            Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue
            Get-ChildItem "C:\Program Files\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue
          ) | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName "installer\DemosSuite.iss"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModernUI-Demos-Installer
          path: dist/ModernUI_Demos_Setup_*.exe
          if-no-files-found: error
          retention-days: 14
